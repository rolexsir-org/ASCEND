name: ascend
description: ASCEND — a privacy-first, on-device personal improvement coach.
publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.12.0 <4.0.0'
  flutter: '>=3.47.9'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  go_router: ^18.1.3
  sqflite: ^2.4.5
  path: ^1.9.1
  path_provider: ^2.1.6
  camera: ^0.12.2
  image: ^4.12.0
  cryptography: ^2.9.0
  flutter_secure_storage: ^11.2.0
  purchases_flutter: ^11.0.0
  flutter_local_notifications: ^22.3.3
  timezone: ^0.11.0
  flutter_timezone: ^5.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.4.5

flutter:
  uses-material-design: true
